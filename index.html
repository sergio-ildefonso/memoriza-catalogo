<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memoriza — Catálogo</title>
    <link rel="icon" href="data:,">
    <style>
        body { font-family: system-ui, sans-serif; margin: 0 auto; max-width: 1100px; padding: 24px; color: #222; }
        header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
        h1 { margin: 0; }
        button { font: inherit; padding: 6px 12px; border: 1px solid #ccc; border-radius: 6px; background: #fff; cursor: pointer; }
        button[type="submit"] { background: #222; border-color: #222; color: #fff; }
        #products { display: grid; gap: 20px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
        .card { border: 1px solid #e3e3e3; border-radius: 8px; padding: 16px; display: flex; flex-direction: column; }
        .card img { width: 100%; height: 160px; object-fit: contain; background: #fafafa; border-radius: 4px; }
        .card h2 { font-size: 1.1rem; margin: 12px 0 6px; }
        .card p { margin: 0 0 8px; font-size: 0.9rem; line-height: 1.4; }
        .card .meta { color: #666; font-size: 0.8rem; }
        .actions { display: flex; gap: 8px; margin-top: auto; padding-top: 12px; }
        .actions button { padding: 4px 10px; font-size: 0.85rem; }
        .actions .danger { color: #b00020; }
        #empty { color: #666; }
        dialog { border: none; border-radius: 10px; padding: 20px; width: min(420px, 90vw); box-shadow: 0 10px 40px rgba(0,0,0,.2); }
        dialog::backdrop { background: rgba(0,0,0,.35); }
        dialog h2 { margin-top: 0; }
        dialog label { display: block; font-size: 0.85rem; margin-bottom: 10px; }
        dialog input, dialog textarea { display: block; width: 100%; box-sizing: border-box; margin-top: 4px; padding: 6px; font: inherit; border: 1px solid #ccc; border-radius: 4px; }
        dialog .actions { justify-content: flex-end; padding-top: 4px; }
    </style>
</head>
<body>
    <header>
        <h1>Memoriza — Catálogo</h1>
        <button id="new-product" hidden>Novo produto</button>
    </header>
    <div id="products"></div>
    <p id="empty" hidden>Sem produtos. Cria o primeiro com "Novo produto".</p>

    <dialog id="product-dialog">
        <form id="product-form">
            <h2 id="dialog-title">Novo produto</h2>
            <label>Nome <input name="name" required></label>
            <label>Descrição <textarea name="description" rows="3" required></textarea></label>
            <label>Material <input name="material"></label>
            <label>Tipo <input name="tipo"></label>
            <label>Tamanho <input name="tamanho"></label>
            <label>Imagem <input name="image" placeholder="images/placa-nogueira.svg"></label>
            <label>Ou carregar imagem <input type="file" name="file" accept="image/png,image/jpeg,image/webp"></label>
            <div class="actions">
                <button type="button" id="cancel">Cancelar</button>
                <button type="submit">Guardar</button>
            </div>
        </form>
    </dialog>

    <script type="module" src="./src/main.js"></script>
</body>
</html>
